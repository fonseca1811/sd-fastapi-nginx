# =====================================================================
#  Nginx como proxy reverso da API FastAPI + Uvicorn
#  Este arquivo é incluído DENTRO do bloco http { } do nginx.conf
#    - Linux:   /etc/nginx/conf.d/fastapi.conf
#    - Windows: C:\nginx\conf\fastapi.conf  +  "include fastapi.conf;" no http { }
# =====================================================================

# ---- Rate limiting -------------------------------------------------
# Cada IP pode fazer 10 requisições por segundo.
# 10m = 10 MB de memória compartilhada para guardar os IPs (~160 mil IPs).
limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=10r/s;
# Limita também conexões simultâneas por IP.
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ---- Upstream: para onde o Nginx repassa as requisições ------------
upstream fastapi_backend {
    server 127.0.0.1:8000;          # instância 1 do Uvicorn
    # server 127.0.0.1:8001;        # BÔNUS: descomente para balancear entre 2 instâncias
    keepalive 32;                   # reaproveita conexões com o Uvicorn
}

server {
    listen      8080;               # porta pública (o cliente só enxerga esta)
    server_name localhost;

    server_tokens off;              # não revela a versão do Nginx nas respostas
    client_max_body_size 1m;        # corpo máximo de uma requisição

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "no-referrer" always;

    # Compressão das respostas JSON
    gzip       on;
    gzip_types application/json text/plain;

    # Respostas personalizadas de erro
    error_page 429 = @muitas_requisicoes;
    error_page 502 503 504 = @api_fora_do_ar;

    # ---- Tudo o que chega é repassado para a API --------------------
    location / {
        limit_req        zone=api_limit burst=20 nodelay;   # tolera picos de até 20 extras
        limit_req_status 429;
        limit_conn       conn_limit 20;
        limit_conn_status 429;

        proxy_pass         http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Health check do próprio Nginx (não chega no Python)
    location = /nginx-health {
        access_log   off;
        default_type text/plain;
        return 200 "nginx ok\n";
    }

    location @muitas_requisicoes {
        default_type application/json;
        return 429 '{"detail": "Muitas requisicoes. Tente novamente em instantes."}';
    }

    location @api_fora_do_ar {
        default_type application/json;
        return 503 '{"detail": "API indisponivel no momento."}';
    }
}
